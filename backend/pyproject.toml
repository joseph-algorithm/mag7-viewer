[project]
name = "mag7-backend"
version = "0.1.0"
description = "FastAPI backend serving daily returns for the MAG7 stocks"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "yfinance>=0.2.50",
    "pandas>=2.2",
]

[project.scripts]
# `uv run dev` starts the API with autoreload.
dev = "app.dev:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "mypy>=1.13",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
